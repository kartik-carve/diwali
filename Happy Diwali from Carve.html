<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali from Carve</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#F5D900;--k:#000;--p:#8B00FF;--w:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--y);color:var(--k);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;text-align:center;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:28px 20px 60px}
.logo{height:46px;display:block;margin:0 auto 24px}
.frame{border:2px solid var(--k);padding:10px;position:relative}
.panel{background:rgba(255,255,255,.62);border:2px solid var(--k);padding:clamp(24px,5vw,52px) clamp(16px,4vw,48px);position:relative}
.dot{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--w);border:3px solid var(--k)}
.dot.tr{top:-15px;right:-15px}.dot.bl{bottom:-15px;left:-15px}
.cols{display:grid;grid-template-columns:1fr;gap:30px;align-items:center}
.diya{width:min(340px,82%);margin:0 auto}
.diya::before{content:'';display:block;padding-top:58%}
.bowl{position:relative}
@media(min-width:780px){.cols{grid-template-columns:1.15fr .85fr;gap:20px}.txt{text-align:left}.txt .msg{margin-left:0}.squig{margin-left:0!important}.diya{width:100%}}
.diya img{width:100%;display:block;position:relative;z-index:1;filter:drop-shadow(0 14px 10px rgba(0,0,0,.18))}
.flame{position:absolute;left:50%;bottom:86%;width:24%;transform:translateX(-50%);z-index:2;overflow:visible}
.glow{position:absolute;left:50%;bottom:70%;width:90%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,170,0,.55),rgba(255,170,0,0) 65%);animation:pulse 1.6s ease-in-out infinite;z-index:0}
.f{transform-box:fill-box;transform-origin:50% 100%}
.f1{animation:fl1 1.3s ease-in-out infinite}
.f2{animation:fl2 .9s ease-in-out infinite}
.f3{animation:fl3 .65s ease-in-out infinite}
@keyframes fl1{0%,100%{transform:scale(1,1) skewX(0) rotate(0)}20%{transform:scale(.93,1.08) skewX(-5deg) rotate(-2deg)}45%{transform:scale(1.06,.92) skewX(4deg) rotate(2deg)}70%{transform:scale(.96,1.1) skewX(-3deg) rotate(-1deg)}}
@keyframes fl2{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.9,1.12) skewX(6deg)}60%{transform:scale(1.05,.9) skewX(-5deg)}}
@keyframes fl3{0%,100%{transform:scale(1,1)}35%{transform:scale(.85,1.15)}70%{transform:scale(1.1,.88)}}
@keyframes pulse{0%,100%{opacity:.8;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.12)}}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(48px,9.5vw,104px);line-height:.95;margin:0;letter-spacing:-.02em}
h1 span{display:inline-block;background:var(--y);font-style:italic;font-size:.5em;padding:.05em .3em;transform:rotate(-3deg);margin-top:.3em}
.msg{font-size:clamp(16px,2.2vw,21px);line-height:1.55;max-width:480px;margin:26px auto 28px}
.msg mark{background:var(--y);font-weight:700;padding:0 4px}
.btn{font:700 17px 'Plus Jakarta Sans',sans-serif;background:var(--k);color:var(--y);border:2px solid var(--k);padding:16px 32px;cursor:pointer;border-radius:0;letter-spacing:.02em;transition:.15s}
.btn:hover{background:var(--p);color:var(--w);border-color:var(--p)}
.squig{display:block;width:110px;height:6px;background:var(--p);margin:26px auto 0}
#reveal{display:none;margin-top:34px}
#reveal.on{display:block;animation:up .7s ease both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.card{background:var(--w);border:2px solid var(--k);padding:10px;max-width:560px;margin:0 auto}
.card video{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;background:var(--k)}
footer{margin-top:26px;font-weight:700;font-size:14px;letter-spacing:.08em}
.snd{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:none;font:700 13px 'Plus Jakarta Sans',sans-serif;background:var(--w);color:var(--k);border:2px solid var(--k);padding:9px 14px;cursor:pointer;border-radius:0}
</style></head><body>
